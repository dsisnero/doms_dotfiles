# mruby-specific configuration

AllCops:
  TargetRubyVersion: 1.8
  Exclude:
    - mrblib/**/*
    - src/**/*
    - config/rubocop/**/*

Style/HashSyntax:
  Enabled: true
  EnforcedStyle: hash_rockets
  EnforcedShorthandSyntax: never

Style/Lambda:
  Enabled: false

Style/PercentLiteralDelimiters:
  Enabled: false

Style/Proc:
  Enabled: false

Style/RegexpLiteral:
  Enabled: false

Style/SymbolArray:
  Enabled: false

Style/WordArray:
  Enabled: false

Lint/UnneededCopDisableDirective:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/SymbolProc:
  Enabled: false
